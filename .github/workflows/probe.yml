name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env: { K: "${{ secrets.SERVICE_KEY }}" }
        run: |
          for B in https://apis.data.go.kr/B551182/diseaseInfoService1 https://apis.data.go.kr/B551182/diseaseInfoService; do
          for op in getDissNameCodeList getDissNameCodeList1 getDissNmCdList getDissNameCodeList2 getDissInfoList; do
            echo "== $B/$op"; curl -s --get "$B/$op" --data-urlencode "serviceKey=$K" -d "sickType=1&medTp=1&diseaseType=SICK_CD&searchText=K2&numOfRows=3&pageNo=1" -w "\nHTTP %{http_code}\n" | head -c 700; echo
          done; done
