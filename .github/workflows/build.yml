# 매달 공공데이터를 전부 받아 사이트를 새로 올린다. (Actions 탭에서 'Run workflow'로 바로 실행도 가능)
name: 자료 받기 및 사이트 올리기

on:
  schedule:
    - cron: '0 18 1 * *'   # 매달 2일 새벽 3시(한국 시간)
  workflow_dispatch:
    inputs:
      site_only:
        description: '화면만 다시 올리기 (자료는 지난번 것 그대로)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 지난 자료 가져오기 (화면만 고친 경우)
        if: inputs.site_only
        run: |
          mkdir -p site/data/d
          BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data"
          for f in meta idx price pills recall; do curl -fsS "$BASE/$f.json" -o "site/data/$f.json"; done
          seq -f "%03g" 0 999 | xargs -P 16 -I{} curl -fsS "$BASE/d/{}.json" -o "site/data/d/{}.json"
      - name: 공공데이터 받기
        if: ${{ !inputs.site_only }}
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
          NODE_OPTIONS: --max-old-space-size=12288
        run: node build/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
